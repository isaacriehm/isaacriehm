<svg xmlns="http://www.w3.org/2000/svg" width="830" height="432" viewBox="0 0 830 432" role="img" aria-labelledby="t d">
<title id="t">Specifications</title>
<desc id="d">Specifications. Languages: TypeScript, JavaScript, Python, HTML/CSS, Bash. Frontend: React, Next.js, TanStack Query and Table, Tailwind CSS. Backend: Node.js, NestJS, REST APIs, OpenAPI, tRPC, Zod. Data: PostgreSQL through Drizzle ORM and Prisma: schema design, migrations, transactions. Testing and ops: Jest, Vitest, Playwright, GitHub Actions, Docker, Linux servers (systemd, Caddy), AWS S3, Google Cloud. AI tooling: Claude Code, Cursor, Codex, Model Context Protocol, OpenAI API, review of AI-generated code. Security: Role-based access control, session management, Argon2 password hashing. Upstream: Open pull request to openapi-typescript (#2865): openapi-react-query rejects undeclared query and path parameters.</desc>
<style>@font-face{font-family:LF-Embed;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:LF-Embed;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
svg{--ink:#FFFFFF;--ink2:#D8D8D3;--ink3:#9A9A95;--rule:#3D3D3B;--plateTop:#161616;--plateSide:#262625;--signal:#B8301C;--onSignal:#FFFFFF}
text{font-family:LF-Embed,sans-serif;font-feature-settings:'tnum' 1,'kern' 1}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes explode{from{transform:translateY(var(--c,0px))}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .4s ease-out both}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw .6s cubic-bezier(.4,0,.2,1) both}
.explode{animation:explode .75s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
